<style>
	/* Layout: Push 3 at the top, full width; below, the bank map. */
	:root {
		--bg: #111214;
		--panel: #18191c;
		--line: #2a2c31;
		--fg: #e8e8ea;
		--muted: #9a9ca3;
		--faint: #6b6e76;
		--track: #58c4f0;
		--violet: #b36bff;
		--display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
		--body: "IBM Plex Sans", system-ui, sans-serif;
		/* section colours from the device */
		--h-perf: #e8e8ea; --h-osc: #4cc9e0; --h-hpf: #7fb2ff; --h-vcf: #f5a33b; --h-env: #f2727f;
		--h-lfo: #a6dd5c; --h-fx: #5dd39e; --h-play: #e6d36a; --h-arp: #d8bf5a; --h-amp: #f0c35a;
		--h-mods: #e07bd0; --h-trim: #c9a0e8;
		color-scheme: dark;
	}
	* { box-sizing: border-box; }
	body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); margin: 0; }
	.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 22px; }
	header { display: grid; gap: 6px; }
	h1 { font: 600 26px/1.15 var(--display); letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
	h1 span { color: var(--muted); font-weight: 400; }
	h2 { font: 600 13px/1.2 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
	p { margin: 0; max-width: 72ch; color: #c9cad0; }
	a { color: var(--track); }
	footer p { font-size: 12.5px; color: var(--faint); }

	.rig { background: #0b0b0c; border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
	#push { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 336; touch-action: none; cursor: ns-resize; border-radius: 8px; }

	.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
	.btn { font: 500 13px var(--display); letter-spacing: 0.04em; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 14px; cursor: pointer; user-select: none; }
	.btn[aria-pressed="true"] { background: var(--fg); color: #111; border-color: var(--fg); }
	.btn:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--track); outline-offset: 2px; }
	.check { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
	.check input { accent-color: var(--track); }
	.log { flex: 1 1 320px; min-width: 0; font-size: 13px; color: var(--muted); }
	.log b { color: var(--fg); font-weight: 500; }

	.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

	.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
	table { border-collapse: collapse; width: 100%; min-width: 900px; font: 12.5px/1.3 var(--display); font-variant-numeric: tabular-nums; }
	th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
	thead th { color: var(--faint); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px; background: var(--panel); position: sticky; top: 0; }
	tbody tr { cursor: pointer; }
	tbody tr:hover { background: #1b1c20; }
	tbody tr.cur { background: #1f2a30; }
	td.n { color: var(--faint); width: 26px; }
	td.bank { font-weight: 600; }
	td.bank .dot { margin-right: 7px; }
	td.empty { color: #3d4046; }
	td.btns { color: var(--muted); }
	td.flash { animation: flash 1.6s ease-out; }
	td.mod { color: #cfa6ff; }
	@keyframes flash { from { background: color-mix(in srgb, var(--track) 55%, transparent); color: #fff; } to { background: transparent; } }

	@media (prefers-reduced-motion: reduce) { td.flash { animation: none; background: color-mix(in srgb, var(--track) 30%, transparent); } }
</style>

<div class="wrap">
	<header>
		<h1>Diva AirSlick <span>on Push 3 · Device mode</span></h1>
	</header>

	<div class="rig"><canvas id="push" aria-label="Push 3 in Device mode: encoders, display buttons and display"></canvas></div>

	<div class="bar">
		<button class="btn" id="shift" aria-pressed="false">Shift</button>
		<div class="log" id="log" aria-live="polite"></div>
	</div>

<script>
// Diva AirSlick — Push banks and the device's own parameters ("UI:" keys). The same file drives the
// Max for Live device and this web page.
//
// Banks: Main 1 and Main 2 (what you need to play a sound), then Diva's panels in order (oscillators →
// HPF/filter → envelopes → LFOs → effects → amp, voice, tuning → modifiers → trimmers). Outside the
// Main banks, each parameter appears once.
// The number, order and names of the banks are fixed; their contents follow the selected models (empty
// when a model doesn't need them). A bank that depends on a model comes after the bank holding its selector.
//
// UI: parameters (they don't exist in Diva, the device translates them):
//  - an oscillator's Octave and Detune share Diva's Tune (12 × octave + detune);
//    pushing Detune past ± 6 switches the octave, like Diva's 5-turn knob;
//  - several Diva switches merged into one list (modulation targets, Dual VCO waveforms,
//    Digital envelope options);
//  - "FX n": Off or the selected module (Diva's On switch + module selector).
// Each UI: parameter: sn/ln (short and long names), c (dial | menu), options or min/max, deps (Diva keys
// read), read(get) → control value, write(v, get) → [[Diva key, value 0…1], …].
// get(k) returns the normalised 0…1 value of a Diva parameter.
(function () {
	const root = typeof window !== 'undefined' ? window : globalThis;

	function create(P) {
		const n = (k) => P[k].options.length;
		const gi = (get, k) => Math.min(n(k) - 1, Math.max(0, Math.floor(get(k) * n(k))));
		const nv = (i, N) => (i + 0.5) / N;
		const real = (get, k) => P[k].min + (P[k].max - P[k].min) * get(k);
		const norm = (k, r) => Math.max(0, Math.min(1, (r - P[k].min) / (P[k].max - P[k].min)));
		const on = (get, k) => gi(get, k) === 1;

		// ------------------------------------------------------------ UI: parameters
		const FEET = ["32'", "16'", "8'", "4'", "2'"];
		const VIRT = {};
		const st = (get, o) => real(get, 'OSC:Tune' + o);
		const octOf = (get, o) => Math.max(-2, Math.min(2, Math.round(st(get, o) / 12)));
		const tune = (o, s) => [['OSC:Tune' + o, norm('OSC:Tune' + o, Math.max(-30, Math.min(30, s)))]];
		[1, 2, 3].forEach((o) => {
			VIRT['UI:Oct' + o] = {
				sn: `Osc ${o} Octave`, ln: `Osc Octave ${o}`, c: 'menu', options: FEET, deps: ['OSC:Tune' + o],
				read: (get) => octOf(get, o) + 2,
				write: (i, get) => tune(o, st(get, o) + 12 * (Math.round(i) - 2 - octOf(get, o))),
			};
		});
		[2, 3].forEach((o) => {
			// control range ± 7: the device sees anything past ± 6 and switches the octave
			VIRT['UI:Det' + o] = {

				read: (get) => st(get, o) - 12 * octOf(get, o),
				write: (v, get) => tune(o, 12 * octOf(get, o) + Number(v)),

		const bits = (m) => m.toString(2).split('1').length - 1;
		// 8 characters at most (beyond that, Push spills into the next column):
		// one choice → its name; several → abbreviations joined by "+", or initials; all → All
		function comboText(m, labels) {
			const on = labels.filter((_, j) => m & (1 << j));
			if (!on.length) return 'Off';
			if (on.length === 1) return on[0][0];
			if (on.length === labels.length && labels.length > 3) return 'All';
			const t = on.map((l) => l[1]).join('+');
			return t.length <= 8 ? t : on.map((l) => l[1][0]).join('+');

		function combo(key, sn, ln, keys, labels) {

				for (let m = 0; m < 1 << keys.length; m++) if (bits(m) === c) opts.push(m);

				write: (i) => keys.map((k, j) => [k, nv(opts[Math.round(i)] & (1 << j) ? 1 : 0, 2)]),

		combo('UI:DTMTo', 'Dgt Tune Mod To', 'Osc Dgt Tune Mod Targets', ['OSC:TM1On', 'OSC:TM2On'], ['1', '2']);
		combo('UI:DSMTo', 'Dgt Shape Mod To', 'Osc Dgt Shape Mod Targets', ['OSC:SM1On', 'OSC:SM2On'], ['1', '2']);
		combo('UI:DPWMTo', 'Dgt PWM To', 'Osc Dgt PWM Targets', ['OSC:PWM1', 'OSC:PWM2'], ['1', '2']);

				],

				name: 'Osc 2/3',

					['OSC:Sync2', 'UI:Waves2', 'UI:Oct2', 'UI:Det2', 'OSC:FM', 'OSC:FmSrc', 'OSC:FmDpt', 'OSC:triSp'],

					['OSC:TM2Src', 'OSC:TM2Dpt', 'UI:DTMTo', 'OSC:PWMSrc', 'OSC:PWMDpt', 'UI:DPWMTo', 'OSC:Sh1Src', 'OSC:Sh1Dpt'],

		];
		// effects: "FX n" then 7 module settings; the rest goes to "FX n More" (Phaser, Delay, Rotary)
		const FXMOD = ['Chrs#', 'Phase#', 'Plate#', 'Delay#', 'Rtary#'];
		const FX_MAIN = [
			['Type', 'Rate', 'Depth', 'Wet', null, null, null],
			['Type', 'Rate', 'Sync', 'Depth', 'Center', 'FB', 'Wet'],
			['Pre', 'Size', 'Decay', 'Damp', 'Diff', 'Dry', 'Wet'],

		const R8 = [0, 1, 2, 3, 4, 5, 6, 7];
		const fxBank = (f) => ({ name: 'FX ' + f, hue: 'fx', slots: ['UI:FX' + f, ...R8.slice(0, 7).map((i) => by('fx' + f, FX_MAIN.map((row, m) => fxKey(f, m, row[i]))))] });
		const fxMore = (f) => ({ name: `FX ${f} More`, hue: 'fx',
			slots: R8.map((i) => by('fx' + f, FX_MORE.map((r, m) => (r ? fxKey(f, m, r[i]) : null)))) });

		const FILTER_MORE = [

			{ name: 'Main 1', hue: 'perf',
				slots: ['VCF1:Freq', 'VCF1:Res', 'VCF1:FMDpt', 'ENV2:Dec', 'ENV1:Atk', E1('ENV1:Dec', 'ENV1:Rel', 'ENV1:Rel'),
					OSC('OSC:Shape1', 'OSC:PW', 'OSC:PW', 'OSC:Wave1', 'OSC:PW'), OSC('UI:Det2', 'UI:Det2', 'OSC:Vol3', 'UI:Det2', 'OSC:Tune2')] },
			{ name: 'Main 2', hue: 'perf',
				slots: [OSC('OSC:Vol2', 'OSC:OscMix', 'OSC:Noise', 'OSC:Vol2', 'OSC:OscMix'), 'VCF1:FM2Dpt', 'LFO1:Rate', 'LFO2:Rate',
					'VCC:Porta', fxMix(1), fxMix(2), 'VCA1:Vol'] },
		];

		const BANKS = [
			...MAIN,
			...OSC_BANKS.map((b) => ({ name: b.name, hue: 'osc', slots: R8.map((j) => by('osc', b.m.map((row) => (row ? row[j] : null)))) })),
			// HPF then VCF, left to right as in Diva
			{ name: 'Filter', hue: 'vcf',
				slots: ['HPF:Model', HPF('VCF1:Fback', 'HPF:PFreq', 'HPF:Freq', 'HPF:Freq'), 'VCF1:Model', 'VCF1:Freq', 'VCF1:Res', 'VCF1:KeyScl',
					VCF('VCF1:LMode', 'VCF1:LMode', 'VCF1:SvfMode', 'VCF1:SkRev', 'VCF1:ShpMix'), 'VCF1:FFM'] },
			{ name: 'Filter Mod', hue: 'vcf',
				slots: ['VCF1:FMSrc', 'VCF1:FMDpt', 'VCF1:FM2Src', 'VCF1:FM2Dpt', 'VCF1:ResSrc', 'VCF1:ResDpt', 'VCF1:FfmSrc', 'VCF1:FfmDpt'] },
			{ name: 'Filter More', hue: 'hpf', slots: FILTER_MORE },
			...[1, 2].map((e) => ({ name: 'Env ' + e, hue: 'env',
				slots: [`ENV${e}:Model`, `ENV${e}:Atk`, `ENV${e}:Dec`, `ENV${e}:Sus`, by('env' + e, [`ENV${e}:RelOn`, `ENV${e}:Rel`, `ENV${e}:Rel`]),
					`ENV${e}:Vel`, `ENV${e}:KeyFlw`, by('env' + e, [null, null, `UI:E${e}Opt`])] })),
			...[1, 2].map((l) => ({ name: 'LFO ' + l, hue: 'lfo',
				slots: [`LFO${l}:Sync`, `LFO${l}:Rate`, `LFO${l}:Wave`, `LFO${l}:Trig`, `LFO${l}:Phse`, `LFO${l}:Dly`, `LFO${l}:Polar`, null] })),
			{ name: 'LFO Mod', hue: 'lfo',
				slots: ['LFO1:FMS1', 'LFO1:FMD1', 'LFO1:DMS1', 'LFO1:DMD1', 'LFO2:FMS1', 'LFO2:FMD1', 'LFO2:DMS1', 'LFO2:DMD1'] },
			fxBank(1), fxMore(1), fxBank(2), fxMore(2),
			{ name: 'Amp', hue: 'amp', slots: ['VCA1:Vol', 'VCA1:Pan', 'VCA1:VCA', 'VCA1:ModSrc', 'VCA1:ModDpt', 'VCA1:PanSrc', 'VCA1:PanDpt', 'main:CcOp'] },
			{ name: 'Voice', hue: 'play', slots: ['VCC:Mode', 'VCC:Voices', 'VCC:Voicing', 'VCC:Prior', 'VCC:Porta', 'VCC:PortaM', 'VCC:Porta2', 'VCC:PRange'] },
			{ name: 'Tuning', hue: 'play', slots: ['VCC:Trsp', 'VCC:FTun', 'VCC:PB', 'VCC:PBD', 'OSC:VtoD', 'VCC:MTunS', 'OPT:Acc', 'OPT:OffAcc'] },
			{ name: 'Arp', hue: 'arp', slots: ['ARP:OnOff', 'ARP:Dir', 'ARP:Oct', 'ARP:Order', 'ARP:Rstrt', 'CLK:Base', 'CLK:Mult', 'CLK:Swing'] },
			// the Dual VCO keeps its cross mod in its Osc 2 bank
			{ name: 'Mods', hue: 'mods', slots: [OSC('OSC:FmSrc', null, 'OSC:FmSrc', 'OSC:FmSrc', 'OSC:FmSrc'), OSC('OSC:FmDpt', null, 'OSC:FmDpt', 'OSC:FmDpt', 'OSC:FmDpt'),
				'OSC:NoisSrc', 'OSC:NoisDpt', 'VCF1:FbSrc', 'VCF1:FbDpt', 'MOD:A1Src', 'MOD:A2Src'] },
			{ name: 'Processors', hue: 'mods', slots: ['MOD:RSrc', 'MOD:ISrc', 'MOD:QSrc', 'MOD:Quant', 'MOD:LSrc', 'MOD:Slew', 'MOD:M1Src', 'MOD:M2Src'] },
			{ name: 'Trimmers', hue: 'trim', slots: ['OPT:TSlop', 'OSC:Drift', 'OPT:CSlop', 'OPT:ESlop', 'OPT:PSlop', 'OPT:GSlop', OSC(null, null, null, null, 'OSC:DNoAlia'), null] },
			{ name: 'Voice Map', hue: 'trim', slots: ['OPT:V1Mod', 'OPT:V2Mod', 'OPT:V3Mod', 'OPT:V4Mod', 'OPT:V5Mod', 'OPT:V6Mod', 'OPT:V7Mod', 'OPT:V8Mod'] },
		];

		function res(s, model) {
			if (s == null) return null;
			if (typeof s === 'string') return s;
			if (typeof s === 'function') return res(s(model), model);
			return res(s.v[model(s.by)], model);
		}
		// banks for the current models: [{ name, hue, slots: [key | null] × 8 }]. Fixed number, order and
		// names: only the contents follow the models (empty when a model doesn't need them). Push finds
		// its bank by name: renaming it sends Push to the last bank.
		function build(model) {
			return BANKS.map((b) => ({ name: b.name, hue: b.hue, slots: b.slots.map((s) => res(s, model)) }));
		}

		// ------------------------------------------------------------ text for continuous waveforms
		// marks from Diva's panel [value, name, abbreviation]; between two marks: "Saw>Sqr".
		// 8 characters at most (Push spills over beyond that)
		const WAVES = {
			'OSC:Shape1': [[1, 'Ramp', 'Rmp'], [3, 'Triangle', 'Tri'], [5, 'Saw', 'Saw'], [7, 'Square', 'Sqr'], [8, 'Pls 25%', 'Pls'], [9, 'Narrow', 'Nrw']],
			'OSC:Wave1': [[1, 'Triangle', 'Tri'], [2, 'Saw', 'Saw'], [3, 'PWM', 'PWM'], [4, 'Noise', 'Nse']],
			'OSC:Wave2': [[1, 'Saw', 'Saw'], [2, 'Square', 'Sqr'], [3, 'Pulse', 'Pls'], [4, 'Ring', 'Rng']],
		};
		WAVES['OSC:Shape2'] = WAVES['OSC:Shape3'] = WAVES['OSC:Shape1'];
		function waveText(k, v) {
			const pts = WAVES[k];
			for (let i = 0; i < pts.length - 1; i++) {
				const [a, na, sa] = pts[i], [b, nb, sb] = pts[i + 1];
				if (v > b) continue;
				const t = (v - a) / (b - a);
				if (t <= 0.15) return na;
				if (t >= 0.85) return nb;
				return `${sa}>${sb}`;
			}
			return pts[pts.length - 1][1];
		}

		return { VIRT, BANKS, build, res, WAVES, waveText, FEET };
	}

	root.DW_BANKS = { create };
})();

<script>
// Diva AirSlick — simulation of the Push banks (Device mode).
// Behaviour follows the Push 2/3 manual:
//  - 8 touch-sensitive encoders above the display; touching one highlights its parameter;
//    Shift = fine adjustment.
//  - lower button row = banks; with more than 8, the outer buttons become arrows that select the
//    previous or next bank, and the row slides by one bank to keep it in view.
//  - upper row: the left button goes back up to the device chain.
// "UI:" parameters are the device's own (they don't exist in Diva): octave and detune sharing one
// Tune setting, modulation targets merged into one list, and so on.
(function () {
	const D = window.DIVA, SN = window.DW_SN || {};
	const P = Object.assign({}, D.params);
	const V = Object.assign({}, D.values);

	// ---------------------------------------------------------------- real values
	const nreal = (k) => (P[k].options ? P[k].options.length : 0);
	const ridx = (k) => Math.min(nreal(k) - 1, Math.max(0, Math.floor((V[k] ?? 0) * nreal(k))));
	const rset = (k, i) => { V[k] = (i + 0.5) / nreal(k); };

	// ---------------------------------------------------------------- banks and UI: parameters
	// banks.js is the file the device uses, so the page shows exactly what Push gets
	const B = window.DW_BANKS.create(D.params), VIRT = B.VIRT;
	const get = (k) => V[k] ?? 0;
	const apply = (k, v) => VIRT[k].write(v, get).forEach(([dk, x]) => { V[dk] = x; });
	Object.keys(VIRT).forEach((k) => { P[k] = VIRT[k].c === 'menu' ? { kind: 'enum', options: VIRT[k].options } : { kind: 'continuous', min: VIRT[k].min, max: VIRT[k].max }; });

	// same access for real and UI: parameters
	const nopt = (k) => (P[k].options ? P[k].options.length : 0);
	const idx = (k) => (VIRT[k] ? VIRT[k].read(get) : ridx(k));
	const setIdx = (k, i) => (VIRT[k] ? apply(k, i) : rset(k, i));
	// Detune: the ring shows ± 6 semitones around the octave
	const norm = (k) => (VIRT[k] ? (VIRT[k].read(get) + 6) / 12 : V[k] ?? 0);

	// ---------------------------------------------------------------- models
	const SEL = { osc: 'OSC:Model', hpf: 'HPF:Model', vcf: 'VCF1:Model', env1: 'ENV1:Model', env2: 'ENV2:Model', fx1: 'FX1:Module', fx2: 'FX2:Module' };
	const SEL_NAMES = {
		osc: ['Triple VCO', 'Dual VCO', 'DCO', 'Eco', 'Digital'],
		hpf: ['Feedback', 'HPF Post', 'HPF Pre', 'HPF Bite'],
		vcf: ['Ladder', 'Cascade', 'Multimode', 'Bite', 'Uhbie'],
		env1: ['ADS', 'Analogue', 'Digital'],
		env2: ['ADS', 'Analogue', 'Digital'],
		fx1: ['Chorus', 'Phaser', 'Plate', 'Delay', 'Rotary'],
		fx2: ['Chorus', 'Phaser', 'Plate', 'Delay', 'Rotary'],
	};
	const SEL_LABEL = { osc: 'Oscillators', hpf: 'HPF', vcf: 'Filter', env1: 'Env 1', env2: 'Env 2', fx1: 'FX 1', fx2: 'FX 2' };
	const model = (sec) => ridx(SEL[sec]);
	const build = () => B.build(model).map((b) => Object.assign(b, { buttons: [] }));

	// ---------------------------------------------------------------- names and values shown
	// list texts: the device's (0/1 switches → Off/On)
	const TOGGLE = (k) => P[k].options && P[k].options.length === 2 && P[k].options[0] === '0' && P[k].options[1] === '1';
	const OPTS = { 'OSC:PWM2': ['Osc 1', 'Osc 1+2'] };
	const opts = (k) => (window.DW_ENUM || {})[k] || OPTS[k] || (TOGGLE(k) ? ['Off', 'On'] : P[k].options);
	const name = (k) => SN[k] || P[k].name;
	// the device's "%+.2f st" format
	const signed = (x, d) => (x < 0 ? '-' : '+') + Math.abs(x).toFixed(d);
	function fmt(k) {
		const p = P[k];
		if (p.options) return opts(k)[idx(k)];
		if (VIRT[k]) return signed(VIRT[k].read(get), 2) + ' st';
		const v = p.min + (p.max - p.min) * (V[k] ?? 0);
		if (B.WAVES[k]) return B.waveText(k, v);
		// Push drops a trailing zero: 80.00 → 80.0, 67.34 stays
		return v.toFixed(p.dec ?? 2).replace(/(\.\d)0$/, '$1');
	}

	// ---------------------------------------------------------------- simulation state
	const S = {
		banks: build(),
		bank: 0, // index of the selected bank button
		first: 0, // first bank shown in the lower row
		touched: -1,
		shift: false,
		buttons: false, // everything sits on the encoders: no bank buttons (@buttons)
		top: false, // device chain level (upper left button)
		flash: new Map(), // "bank:slot" → time of the change
		acc: {},
	};

	// lower row: a window over the banks, with ← in the first button when banks are hidden on the
	// left and → in the last when banks are hidden on the right; it slides just enough to show the
	// selected bank (on Push 3: ← Osc 2/3 … Env 1 →)
	function lower() {
		const n = S.banks.length;
		const lay = (first) => {
			const left = first > 0;
			let room = 8 - (left ? 1 : 0);
			const right = first + room < n;
			if (right) room -= 1;
			return { left, right, items: Array.from({ length: Math.min(room, n - first) }, (_, j) => first + j) };
		};
		if (S.bank < S.first) S.first = S.bank;
		let L = lay(S.first);
		while (S.bank > L.items[L.items.length - 1]) L = lay(++S.first);
		return L;
	}
	// an arrow selects the previous or next bank
	const step = (dir) => { S.bank = Math.max(0, Math.min(S.banks.length - 1, S.bank + dir)); };

	// ---------------------------------------------------------------- gestures
	function changed(k) {
		const keys = VIRT[k] ? VIRT[k].deps : [k];
		const sec = Object.keys(SEL).find((s) => keys.includes(SEL[s]));
		if (sec) rebuild(sec);
	}
	function turn(slot, delta) {
		const k = S.banks[S.bank].slots[slot];
		if (!k) return;
		const p = P[k];
		if (p.options) {
			// stepped encoder: one step every ~ 14 px (slower with Shift)
			S.acc[slot] = (S.acc[slot] || 0) + delta;
			const step = S.shift ? 40 : 14;
			while (Math.abs(S.acc[slot]) >= step) {
				const dir = Math.sign(S.acc[slot]);
				S.acc[slot] -= dir * step;
				const i = Math.max(0, Math.min(nopt(k) - 1, idx(k) + dir));
				if (i !== idx(k)) { setIdx(k, i); changed(k); }
			}
		} else if (VIRT[k]) {
			// Detune: 12 semitones per encoder sweep; past ± 6, the octave switches
			apply(k, VIRT[k].read(get) + (delta * 12) / (S.shift ? 3000 : 300));
		} else {
			V[k] = Math.max(0, Math.min(1, (V[k] ?? 0) + delta / (S.shift ? 3000 : 300)));
		}
	}
	function press(k) {
		setIdx(k, (idx(k) + 1) % nopt(k));
		changed(k);
	}

	// a model changed: the banks are rebuilt in place and Push keeps the selected bank button
	const log = [];
	function rebuild(sec) {
		const before = S.banks, after = build(), now = performance.now();
		let count = 0;
		after.forEach((b, i) => {
			const old = before[i] || { slots: [], name: null };
			b.slots.forEach((k, j) => { if (old.slots[j] !== k) { S.flash.set(i + ':' + j, now); count++; } });
			if (old.name !== b.name) S.flash.set(i + ':name', now);
		});
		S.banks = after;
		S.bank = Math.min(S.bank, after.length - 1);
		log.unshift({ sec, model: SEL_NAMES[sec][model(sec)], count, bank: after[S.bank].name });
		if (log.length > 6) log.pop();
	}

	window.DW_PUSH = { S, P, V, SEL, SEL_NAMES, SEL_LABEL, VIRT, model, idx, setIdx, norm, changed, turn, press, lower, step, fmt, opts, nopt, name, log };
})();
</script>
<script>
(function () {
	const X = window.DW_PUSH, S = X.S, P = X.P;
	const W = 1000, H = 336, DX = 20, DY = 126, DW = 960, DH = 160, COL = 120;
	const HUE = (h) => getComputedStyle(document.documentElement).getPropertyValue('--h-' + h).trim();
	const TRACK = getComputedStyle(document.documentElement).getPropertyValue('--track').trim();
	const FONT = '"IBM Plex Sans", "Helvetica Neue", sans-serif';
	// Push 3 display, from a photo of the device on Env 1: names small and bold, values large and
	// light, everything left-aligned in its column and cut without an ellipsis (ADS / analogu / digital)
	const PAD = 9, ACCENT = '#a9d3ff', SELECT = '#3f8fe8';
	const cv = document.getElementById('push'), ctx = cv.getContext('2d');
	let cssW = 1000;

	// ------------------------------------------------------------ drawing
	function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
	function clip(str, max) {
		while (str.length > 1 && ctx.measureText(str).width > max) str = str.slice(0, -1);
		return str;
	}
	function text(str, x, y, { size = 12, weight = 400, color = '#fff', max = COL - 2 * PAD, align = 'left' } = {}) {
		ctx.font = `${weight} ${size}px ${FONT}`;
		ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
		ctx.fillText(clip(String(str), max), x, y);
	}
	const flashAge = (key) => { const t = S.flash.get(key); return t == null ? Infinity : performance.now() - t; };
	const FLASH = 1500;

	function lowerLabels() {
		const L = X.lower();
		const out = new Array(8).fill(null);
		let j = 0;
		if (L.left) out[j++] = { arrow: -1 };
		L.items.forEach((b) => { out[j++] = { bank: b }; });
		if (L.right) out[7] = { arrow: 1 };
		return out;
	}
	function upperLabels() {
		const out = new Array(8).fill(null);
		out[0] = { back: true };
		if (S.buttons && !S.top) S.banks[S.bank].buttons.forEach((k, j) => { out[j + 1] = { key: k }; });
		return out;
	}

	function draw() {
		const dpr = window.devicePixelRatio || 1;
		ctx.setTransform((cssW * dpr) / W, 0, 0, (cssW * dpr) / W, 0, 0);
		ctx.clearRect(0, 0, W, H);
		// front panel
		ctx.fillStyle = '#19191b'; rr(0, 0, W, H, 10); ctx.fill();
		const bank = S.banks[S.bank], up = upperLabels(), low = lowerLabels();

		for (let i = 0; i < 8; i++) {
			const cx = DX + i * COL + COL / 2;
			// encoder (endless: no position mark)
			const touched = S.touched === i;
			ctx.fillStyle = '#0d0d0e'; ctx.beginPath(); ctx.arc(cx, 50, 31, 0, Math.PI * 2); ctx.fill();
			const g = ctx.createRadialGradient(cx - 8, 40, 4, cx, 50, 27);
			g.addColorStop(0, '#4a4b50'); g.addColorStop(1, '#2a2b2f');
			ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, 50, 26, 0, Math.PI * 2); ctx.fill();
			ctx.strokeStyle = touched ? TRACK : '#3a3b40'; ctx.lineWidth = touched ? 2.5 : 1;
			ctx.beginPath(); ctx.arc(cx, 50, 28.5, 0, Math.PI * 2); ctx.stroke();
			for (let t = 0; t < 24; t++) {
				const a = (t / 24) * Math.PI * 2;
				ctx.strokeStyle = '#222327'; ctx.lineWidth = 1;
				ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 22, 50 + Math.sin(a) * 22); ctx.lineTo(cx + Math.cos(a) * 26, 50 + Math.sin(a) * 26); ctx.stroke();
			}
			// hardware buttons (LEDs)
			const u = up[i], l = low[i];
			let uc = '#232427';
			if (u) uc = u.back ? '#7a7b80' : (X.idx(u.key) ? TRACK : '#55565b');
			ctx.fillStyle = uc; rr(cx - 46, 98, 92, 16, 3); ctx.fill();
			let lc = '#232427';
			if (l) lc = l.arrow ? '#9a9ba0' : (l.bank === S.bank ? '#f2f2f2' : '#55565b');
			if (S.top) lc = '#232427';
			ctx.fillStyle = lc; rr(cx - 46, 298, 92, 16, 3); ctx.fill();
		}

		// display
		ctx.fillStyle = '#000'; rr(DX - 4, DY - 4, DW + 8, DH + 8, 4); ctx.fill();
		ctx.save(); ctx.beginPath(); ctx.rect(DX, DY, DW, DH); ctx.clip();
		for (let i = 0; i < 8; i++) {
			const x = DX + i * COL, tx = x + PAD, u = up[i];
			// upper row
			if (u && u.back) {
				if (S.top) { ctx.fillStyle = SELECT; rr(x + 4, DY + 5, COL - 8, 17, 2); ctx.fill(); text('Diva AirSlick', tx, DY + 18, { size: 11.5, weight: 600, color: '#0b1a2b' }); }
				else text('‹ Diva AirSlick', tx, DY + 18, { size: 11.5, weight: 500, color: '#d4d8de' });
			} else if (u) {
				const on = !!X.idx(u.key);
				if (on) { ctx.fillStyle = SELECT; rr(x + 4, DY + 5, COL - 8, 17, 2); ctx.fill(); }
				text(X.name(u.key), tx, DY + 18, { size: 11.5, weight: 500, color: on ? '#0b1a2b' : '#9b9b9b' });
			}
			if (S.top) continue;
			// parameter
			const k = bank.slots[i];
			const age = flashAge(S.bank + ':' + i);
			if (age < FLASH) { ctx.globalAlpha = 0.55 * (1 - age / FLASH); ctx.fillStyle = TRACK; ctx.fillRect(x + 2, DY + 25, COL - 4, 110); ctx.globalAlpha = 1; }
			if (S.touched === i && k) { ctx.fillStyle = '#ffffff12'; ctx.fillRect(x + 2, DY + 25, COL - 4, 110); }
			if (!k) continue;
			const p = P[k];
			text(X.name(k), tx, DY + 38, { size: 12, weight: 600, color: '#e9eef4' });
			if (p.options && X.opts(k).length === 2) {
				// two states: only the current one
				text(X.fmt(k), tx, DY + 72, { size: 26, weight: 500, color: ACCENT });
			} else if (p.options) {
				// lists: three rows, the current one lit
				const o = X.opts(k), cur = X.idx(k);
				const first = Math.max(0, Math.min(o.length - 3, cur - 1));
				for (let r = 0; r < Math.min(3, o.length); r++) {
					const j = first + r;
					text(o[j], tx, DY + 72 + r * 28, { size: 26, weight: j === cur ? 500 : 300, color: j === cur ? ACCENT : '#8a8a8a' });
				}
			} else {
				text(X.fmt(k), tx, DY + 72, { size: 26, weight: 300, color: '#dadada' });
				const v = X.norm(k), a0 = Math.PI * 0.7, a1 = Math.PI * 2.3, R = 18, cx = tx + R, cy = DY + 104;
				ctx.lineCap = 'butt'; ctx.lineWidth = 3;
				ctx.strokeStyle = '#3c3c3c'; ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
				const bip = p.min < 0, av = a0 + (a1 - a0) * v, mid = Math.PI * 1.5;
				ctx.strokeStyle = '#d2d2d2'; // Push has a single ring colour
				ctx.beginPath();
				if (bip) ctx.arc(cx, cy, R, Math.min(mid, av), Math.max(mid, av)); else ctx.arc(cx, cy, R, a0, Math.max(a0 + 0.001, av));
				ctx.stroke();
			}
		}
		// lower row: banks, with ← and → when more are hidden
		for (let i = 0; i < 8; i++) {
			if (S.top) break;
			const x = DX + i * COL, tx = x + PAD, l = low[i];
			if (!l) continue;
			if (l.arrow) { text(l.arrow < 0 ? '←' : '→', tx, DY + 154, { size: 13, weight: 500, color: '#e0e0e0' }); continue; }
			const b = S.banks[l.bank], sel = l.bank === S.bank, age = flashAge(l.bank + ':name');
			if (sel) { ctx.fillStyle = SELECT; rr(x + 4, DY + 141, COL - 8, 18, 2); ctx.fill(); }
			else if (age < FLASH) { ctx.globalAlpha = 0.7 * (1 - age / FLASH); ctx.fillStyle = TRACK; rr(x + 4, DY + 141, COL - 8, 18, 2); ctx.fill(); ctx.globalAlpha = 1; }
			text(b.name, tx, DY + 154, { size: 12, weight: 500, color: sel ? '#0b1a2b' : '#d0d0d0' });
		}
		if (S.top) text('Press  “Diva AirSlick”  again to edit its parameters', DX + DW / 2, DY + 90, { size: 14, color: '#8d8d8d', max: 600, align: 'center' });
		ctx.restore();

		const anyFlash = [...S.flash.values()].some((t) => performance.now() - t < FLASH);
		if (anyFlash) requestAnimationFrame(draw);
	}

	// ------------------------------------------------------------ gestures
	function at(e) {
		const r = cv.getBoundingClientRect();
		return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
	}
	function zone({ x, y }) {
		const i = Math.floor((x - DX) / COL);
		if (i < 0 || i > 7) return null;
		if (y < 92) return { t: 'enc', i };
		if (y < 122) return { t: 'up', i };
		if (y < DY + DH) return { t: 'enc', i }; // dragging on the display works too
		return { t: 'low', i };
	}
	let drag = null;
	cv.addEventListener('pointerdown', (e) => {
		const p = at(e), z = zone(p);
		if (!z) return;
		if (z.t === 'enc') { drag = { i: z.i, y: p.y }; S.touched = z.i; cv.setPointerCapture(e.pointerId); refresh(); return; }
		if (z.t === 'up') {
			const u = upperLabels()[z.i];
			if (!u) return;
			if (u.back) S.top = !S.top; else X.press(u.key);
			refresh(); return;
		}
		if (z.t === 'low' && !S.top) {
			const l = lowerLabels()[z.i];
			if (!l) return;
			if (l.arrow) X.step(l.arrow);
			else S.bank = l.bank;
			refresh();
		}
	});
	cv.addEventListener('pointermove', (e) => {
		if (!drag) return;
		const p = at(e);
		X.turn(drag.i, drag.y - p.y);
		drag.y = p.y;
		refresh();
	});
	const release = () => { if (drag) { drag = null; S.touched = -1; refresh(); } };
	cv.addEventListener('pointerup', release);
	cv.addEventListener('pointercancel', release);
	let wheelT = null;
	cv.addEventListener('wheel', (e) => {
		const z = zone(at(e));
		if (!z || z.t !== 'enc' || S.top) return;
		e.preventDefault();
		S.touched = z.i;
		X.turn(z.i, -e.deltaY * 0.35);
		clearTimeout(wheelT); wheelT = setTimeout(() => { S.touched = -1; refresh(); }, 500);
		refresh();
	}, { passive: false });

	const shiftBtn = document.getElementById('shift');
	const setShift = (v) => { S.shift = v; shiftBtn.setAttribute('aria-pressed', String(v)); };
	shiftBtn.addEventListener('pointerdown', () => setShift(true));
	shiftBtn.addEventListener('pointerup', () => setShift(false));
	shiftBtn.addEventListener('pointerleave', () => setShift(false));
	addEventListener('keydown', (e) => { if (e.key === 'Shift') setShift(true); });
	addEventListener('keyup', (e) => { if (e.key === 'Shift') setShift(false); });
	addEventListener('blur', () => setShift(false));

	// ------------------------------------------------------------ bank map
	const mapEl = document.getElementById('map');
	const MOD_RE = /Src$|Dpt$|DMS1|DMD1|FMS1|FMD1/;
	function renderMap() {
		const now = performance.now();
		let h = '<thead><tr><th></th><th>Bank</th>' + [1, 2, 3, 4, 5, 6, 7, 8].map((n) => `<th>${n}</th>`).join('') + '</tr></thead><tbody>';
		S.banks.forEach((b, i) => {
			const f = (key) => (now - (S.flash.get(key) ?? -1e9) < 1600 ? ' flash' : '');
			h += `<tr tabindex="0" data-b="${i}" class="${i === S.bank ? 'cur' : ''}"><td class="n">${i + 1}</td>`;
			h += `<td class="bank${f(i + ':name')}"><span class="dot" style="background:${HUE(b.hue)}"></span>${b.name}</td>`;
			b.slots.forEach((k, j) => {
				h += k ? `<td class="${MOD_RE.test(k) ? 'mod' : ''}${f(i + ':' + j)}">${X.name(k)}</td>` : `<td class="empty${f(i + ':' + j)}">—</td>`;
			});
			h += '</tr>';
		});
		mapEl.innerHTML = h + '</tbody>';
	}
	mapEl.addEventListener('click', (e) => {
		const tr = e.target.closest('tr[data-b]');
		if (!tr) return;
		S.bank = Number(tr.dataset.b); S.top = false; refresh();
	});
	mapEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.click(); });

	// ------------------------------------------------------------ status line
	const logEl = document.getElementById('log');
	function renderLog() {
		const l = X.log[0];
		logEl.innerHTML = l
			? `<b>${X.SEL_LABEL[l.sec]} → ${l.model}</b> · ${l.count} slot${l.count === 1 ? '' : 's'} changed · Push stays on “${l.bank}”.`
			: 'Starting from <b>Diva\'s default patch</b>.';
	}

	let lastLog = null, lastBank = -1;
	function refresh() {
		draw();
		const logChanged = X.log[0] !== lastLog;
		if (logChanged || S.bank !== lastBank) { lastBank = S.bank; renderMap(); }
		if (logChanged) { lastLog = X.log[0]; renderLog(); }
	}

	function size() {
		cssW = cv.getBoundingClientRect().width || 1000;
		const dpr = window.devicePixelRatio || 1;
		cv.width = Math.round(cssW * dpr);
		cv.height = Math.round(cssW * dpr * H / W);
		draw();
	}
	new ResizeObserver(size).observe(cv);
	renderLog(); renderMap(); size();
	// the canvas alone doesn't make the browser load a font: ask for each weight it draws with
	document.fonts && Promise.all([300, 400, 500, 600].map((w) => document.fonts.load(`${w} 12px "IBM Plex Sans"`))).then(size);
})();
</script>
</html>
